<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MWS Rewards</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;color:#fff;min-height:100vh;
background:
radial-gradient(circle at 20% 10%,#6d4b0066,transparent 30%),
radial-gradient(circle at 90% 30%,#d99d0033,transparent 25%),
linear-gradient(145deg,#020204,#0d0e13,#020202);
}
.app{max-width:520px;margin:auto;padding:18px 14px 100px}
.header{text-align:center;padding:10px 0 18px}
.logo{font-size:28px;font-weight:900;letter-spacing:2px;color:#ffd34d;text-shadow:0 0 20px #ffd34d66}
.sub{font-size:11px;color:#888;margin-top:6px;letter-spacing:1px}
.balance,.card,.feature{
border:1px solid #ffd34d2e;
background:linear-gradient(145deg,#191a20,#090a0d);
box-shadow:0 10px 30px #0008;
}
.balance{padding:24px;border-radius:25px;text-align:center}
.balance small{color:#888}
.coins{font-size:36px;font-weight:900;color:#ffd34d;margin:8px}
.usd{font-size:17px}
.level{display:inline-block;margin-top:12px;padding:8px 16px;border-radius:20px;background:#111217;color:#ffd34d}

.card{padding:18px;border-radius:20px;margin-top:14px}
.title{color:#ffd34d;font-weight:900;margin-bottom:12px}
.row{display:flex;justify-content:space-between;color:#999;font-size:12px}
.progress{height:9px;background:#292a2f;border-radius:20px;overflow:hidden;margin-top:10px}
.bar{height:100%;width:0;background:linear-gradient(90deg,#8b5a00,#ffd34d,#fff0a0);transition:.3s}

button{
width:100%;border:0;border-radius:14px;padding:14px;margin-top:12px;
font-weight:900;cursor:pointer;
}
.main{background:linear-gradient(135deg,#a86f00,#ffd85b);color:#111}
button:disabled{background:#555!important;color:#aaa!important;cursor:not-allowed}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.feature{padding:20px 8px;border-radius:19px;text-align:center;cursor:pointer}
.feature:active{transform:scale(.96)}
.icon{font-size:30px;margin-bottom:7px}
.feature strong{display:block;color:#ffd34d}
.feature span{display:block;color:#888;font-size:11px;margin-top:5px}

.modalbg{
display:none;position:fixed;inset:0;background:#000d;
z-index:99;align-items:flex-end;justify-content:center
}
.modal{
width:100%;max-width:520px;max-height:90vh;overflow:auto;
background:linear-gradient(145deg,#17181e,#07080a);
border:1px solid #ffd34d55;border-radius:28px 28px 0 0;
padding:22px
}
.close{
float:right;width:36px;height:36px;padding:0;margin:0;
background:#292a2f;color:white;border-radius:50%
}
h2{color:#ffd34d;margin-bottom:15px}
.info{color:#999;font-size:13px;line-height:1.6}

.day,.task,.rank{
padding:15px;margin-top:10px;border-radius:15px;
background:#17181e;border:1px solid #333
}
.day.claimed{background:#555;color:#bbb}
.day.active{border-color:#ffd34d}
.seal{float:right;color:#ddd;font-size:11px;font-weight:bold}
